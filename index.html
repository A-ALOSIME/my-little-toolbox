<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مجموعة مختارة من التطبيقات المفيدة لأجهزتك.">
  <title>My Little Toolbox</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="./"><span class="brand-mark">✳</span><span>My Little<br>Toolbox<span class="brand-dot">.</span></span></a><div class="header-actions"><button id="language" class="language" type="button" lang="en">English</button></div></header>
  <main class="wrap">
    <section class="intro"><div><p class="intro-label" data-i18n="eyebrow">أدوات تستحق مكانًا على جهازك</p><h1 data-i18n="title">برامج مفيدة،<br>في مكان واحد.</h1><p class="lead" data-i18n="lead">مجموعة مختارة من التطبيقات للعمل والإبداع وكل ما بينهما. اكتشف ما يناسبك وحمّله من مصدره الرسمي.</p></div><div class="intro-art" aria-hidden="true"><span>✳</span></div></section>
    <section aria-labelledby="collection-title" class="collection"><div class="section-heading"><div><p class="intro-label" data-i18n="browse">استكشف المجموعة</p><h2 id="collection-title" data-i18n="collection">كل الأدوات</h2></div><span id="count" class="count"></span></div>
      <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" data-placeholder="search" aria-label="البحث عن تطبيق"></label><label class="platform-label"><span data-i18n="platform">النظام</span><select id="platform"><option value="all" data-i18n="allPlatforms">كل الأنظمة</option><option>Windows</option><option>macOS</option><option>Linux</option><option>Web</option></select></label></div>
      <div id="categories" class="categories" aria-label="التصنيفات"></div><div id="apps" class="app-grid"></div><p id="empty" class="empty" hidden data-i18n="empty">ما لقينا تطبيقات تطابق بحثك.</p>
    </section>
  </main>
  <footer class="wrap footer"><span>My Little Toolbox</span><span data-i18n="footer">روابط مباشرة إلى المصادر الرسمية.</span></footer>
  <dialog id="details"><button id="close" class="close" type="button" aria-label="إغلاق">×</button><div id="dialog-body"></div></dialog>
</body>
</html>
